<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AuthKit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #1a1a1a;
    --border: #2a2a2a;
    --border2: #333;
    --text: #f0ede8;
    --muted: #666;
    --accent: #e8ff47;
    --accent-dim: rgba(232,255,71,0.12);
    --accent-dim2: rgba(232,255,71,0.06);
    --danger: #ff4f4f;
    --success: #47ff8e;
    --google: #fff;
    --github: #fff;
    --radius: 10px;
    --mono: 'DM Mono', monospace;
    --display: 'Syne', sans-serif;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated grid background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 48px 48px;
    opacity: 0.4;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    width: 600px; height: 600px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(232,255,71,0.06) 0%, transparent 70%);
    top: -200px; right: -200px;
    z-index: 0;
    pointer-events: none;
  }

  /* ── Layout ── */
  .app { position: relative; z-index: 1; width: 100%; max-width: 420px; padding: 24px; }

  /* ── Pages ── */
  .page { display: none; animation: fadeUp 0.35s ease; }
  .page.active { display: block; }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(16px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── Card ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 36px 32px;
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.5;
  }

  /* ── Header ── */
  .logo {
    font-family: var(--display);
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
    margin-bottom: 28px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo-dot {
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    display: inline-block;
  }

  .card-title {
    font-family: var(--display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 6px;
  }

  .card-sub {
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 28px;
  }

  /* ── Form ── */
  .field { margin-bottom: 16px; }

  label {
    display: block;
    font-size: 11px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 7px;
  }

  input {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 11px 14px;
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  input::placeholder { color: var(--muted); }

  /* ── Buttons ── */
  .btn {
    width: 100%;
    padding: 12px;
    border-radius: var(--radius);
    border: none;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .btn-primary {
    background: var(--accent);
    color: #0a0a0a;
    margin-top: 8px;
    font-weight: 600;
  }

  .btn-primary:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .btn-primary:active { transform: translateY(0); }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn-social {
    background: var(--surface2);
    color: var(--text);
    border: 1px solid var(--border);
    font-size: 13px;
  }

  .btn-social:hover {
    border-color: var(--border2);
    background: #222;
  }

  /* ── Divider ── */
  .divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 20px 0;
    color: var(--muted);
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
  }

  .divider::before, .divider::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  /* ── Toggle ── */
  .toggle {
    text-align: center;
    margin-top: 20px;
    font-size: 13px;
    color: var(--muted);
  }

  .toggle a {
    color: var(--accent);
    text-decoration: none;
    cursor: pointer;
    font-weight: 500;
  }

  .toggle a:hover { text-decoration: underline; }

  /* ── Alert ── */
  .alert {
    padding: 10px 14px;
    border-radius: var(--radius);
    font-size: 13px;
    margin-bottom: 16px;
    display: none;
  }

  .alert.show { display: block; }
  .alert.error { background: rgba(255,79,79,0.1); border: 1px solid rgba(255,79,79,0.3); color: #ff8080; }
  .alert.success { background: rgba(71,255,142,0.08); border: 1px solid rgba(71,255,142,0.3); color: var(--success); }

  /* ── Dashboard ── */
  .dash-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
  }

  .badge {
    background: var(--accent-dim);
    border: 1px solid rgba(232,255,71,0.3);
    color: var(--accent);
    font-size: 11px;
    padding: 3px 10px;
    border-radius: 20px;
    font-weight: 500;
  }

  .info-grid {
    display: grid;
    gap: 10px;
    margin-bottom: 24px;
  }

  .info-row {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 12px 14px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }

  .info-key {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    flex-shrink: 0;
  }

  .info-val {
    font-size: 13px;
    color: var(--text);
    text-align: right;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 220px;
  }

  .token-box {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px;
    margin-bottom: 20px;
  }

  .token-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    margin-bottom: 8px;
  }

  .token-val {
    font-size: 11px;
    color: var(--accent);
    word-break: break-all;
    line-height: 1.6;
    opacity: 0.8;
  }

  .btn-danger {
    background: transparent;
    color: var(--danger);
    border: 1px solid rgba(255,79,79,0.3);
  }

  .btn-danger:hover {
    background: rgba(255,79,79,0.08);
    border-color: var(--danger);
  }

  /* Spinner */
  .spinner {
    width: 14px; height: 14px;
    border: 2px solid rgba(10,10,10,0.3);
    border-top-color: #0a0a0a;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    display: none;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* OAuth icon SVGs */
  .icon { width: 16px; height: 16px; flex-shrink: 0; }
</style>
</head>
<body>

<div class="app">

  <!-- ── LOGIN PAGE ── -->
  <div class="page active" id="page-login">
    <div class="card">
      <div class="logo"><span class="logo-dot"></span>AuthKit</div>
      <div class="card-title">Welcome back</div>
      <div class="card-sub">Sign in to your account</div>

      <div class="alert error" id="login-error"></div>
      <div class="alert success" id="login-success"></div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"/>
      </div>

      <button class="btn btn-primary" id="login-btn" onclick="handleLogin()">
        <span class="spinner" id="login-spinner"></span>
        <span id="login-btn-text">Sign in</span>
      </button>

      <div class="divider">or continue with</div>

      <div style="display:grid;gap:10px">
        <button class="btn btn-social" onclick="oauthLogin('google')">
          <svg class="icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
        <button class="btn btn-social" onclick="oauthLogin('github')">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          Continue with GitHub
        </button>
      </div>

      <div class="toggle">
        Don't have an account? <a onclick="showPage('register')">Register</a>
      </div>
    </div>
  </div>

  <!-- ── REGISTER PAGE ── -->
  <div class="page" id="page-register">
    <div class="card">
      <div class="logo"><span class="logo-dot"></span>AuthKit</div>
      <div class="card-title">Create account</div>
      <div class="card-sub">Get started for free</div>

      <div class="alert error" id="register-error"></div>
      <div class="alert success" id="register-success"></div>

      <div class="field">
        <label>Email</label>
        <input type="email" id="register-email" placeholder="you@example.com" autocomplete="email"/>
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="register-password" placeholder="Min. 8 characters" autocomplete="new-password"/>
      </div>

      <button class="btn btn-primary" id="register-btn" onclick="handleRegister()">
        <span class="spinner" id="register-spinner"></span>
        <span id="register-btn-text">Create account</span>
      </button>

      <div class="divider">or continue with</div>

      <div style="display:grid;gap:10px">
        <button class="btn btn-social" onclick="oauthLogin('google')">
          <svg class="icon" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
          </svg>
          Continue with Google
        </button>
        <button class="btn btn-social" onclick="oauthLogin('github')">
          <svg class="icon" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/>
          </svg>
          Continue with GitHub
        </button>
      </div>

      <div class="toggle">
        Already have an account? <a onclick="showPage('login')">Sign in</a>
      </div>
    </div>
  </div>

  <!-- ── DASHBOARD PAGE ── -->
  <div class="page" id="page-dashboard">
    <div class="card">
      <div class="dash-header">
        <div class="logo" style="margin-bottom:0"><span class="logo-dot"></span>AuthKit</div>
        <span class="badge">● authenticated</span>
      </div>

      <div class="card-title">Dashboard</div>
      <div class="card-sub" style="margin-bottom:20px">You're signed in</div>

      <div class="info-grid" id="user-info"></div>

      <div class="token-box">
        <div class="token-label">Access token</div>
        <div class="token-val" id="token-display"></div>
      </div>

      <button class="btn btn-danger" onclick="handleLogout()">
        <span class="spinner" id="logout-spinner"></span>
        <span id="logout-btn-text">Sign out</span>
      </button>
    </div>
  </div>

</div>

<script>
const API = 'http://localhost:8000';
let accessToken = null;

// ── Page routing ──
function showPage(name) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById('page-' + name).classList.add('active');
}

// ── Alerts ──
function showAlert(id, msg, type = 'error') {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.className = 'alert ' + type + ' show';
  setTimeout(() => el.classList.remove('show'), 5000);
}

// ── Loading state ──
function setLoading(btnId, spinnerId, textId, loading, text) {
  document.getElementById(btnId).disabled = loading;
  document.getElementById(spinnerId).style.display = loading ? 'block' : 'none';
  document.getElementById(textId).style.display = loading ? 'none' : 'inline';
}

// ── Register ──
async function handleRegister() {
  const email = document.getElementById('register-email').value.trim();
  const password = document.getElementById('register-password').value;
  if (!email || !password) return showAlert('register-error', 'Please fill in all fields');

  setLoading('register-btn', 'register-spinner', 'register-btn-text', true);
  try {
    const res = await fetch(`${API}/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Registration failed');
    showAlert('register-success', 'Account created! Signing you in...', 'success');
    setTimeout(() => showPage('login'), 1200);
  } catch (e) {
    showAlert('register-error', e.message);
  } finally {
    setLoading('register-btn', 'register-spinner', 'register-btn-text', false);
  }
}

// ── Login ──
async function handleLogin() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) return showAlert('login-error', 'Please fill in all fields');

  setLoading('login-btn', 'login-spinner', 'login-btn-text', true);
  try {
    const form = new URLSearchParams();
    form.append('username', email);
    form.append('password', password);

    const res = await fetch(`${API}/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
      body: form,
      credentials: 'include'
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail || 'Login failed');

    accessToken = data.access_token;
    await loadDashboard();
    showPage('dashboard');
  } catch (e) {
    showAlert('login-error', e.message);
  } finally {
    setLoading('login-btn', 'login-spinner', 'login-btn-text', false);
  }
}

// ── OAuth ──
function oauthLogin(provider) {
  const redirectTo = window.location.href;
  const params = new URLSearchParams({ redirect_to: redirectTo });
  window.location.href = `${API}/auth/${provider}/login?${params.toString()}`;
}

// ── Handle OAuth callback (access_token in URL) ──
function checkOAuthCallback() {
  const url = new URL(window.location.href);
  const token = url.searchParams.get('access_token');
  if (token) {
    accessToken = token;
    url.searchParams.delete('access_token');
    const nextQuery = url.searchParams.toString();
    const nextUrl = `${url.pathname}${nextQuery ? `?${nextQuery}` : ''}${url.hash}`;
    window.history.replaceState({}, '', nextUrl);
    loadDashboard().then(() => showPage('dashboard'));
  }
}

// ── Load user info ──
async function loadDashboard() {
  try {
    const res = await fetch(`${API}/users/me`, {
      headers: { 'Authorization': `Bearer ${accessToken}` },
      credentials: 'include'
    });
    const user = await res.json();
    if (!res.ok) throw new Error('Failed to load user');

    document.getElementById('user-info').innerHTML = `
      <div class="info-row">
        <span class="info-key">Email</span>
        <span class="info-val">${user.email}</span>
      </div>
      <div class="info-row">
        <span class="info-key">User ID</span>
        <span class="info-val">#${user.id}</span>
      </div>
      <div class="info-row">
        <span class="info-key">Provider</span>
        <span class="info-val">${user.provider}</span>
      </div>
    `;

    document.getElementById('token-display').textContent =
      accessToken.slice(0, 40) + '...' + accessToken.slice(-20);
  } catch (e) {
    showAlert('login-error', 'Could not load user info');
  }
}

// ── Logout ──
async function handleLogout() {
  document.getElementById('logout-btn-text').textContent = 'Signing out...';
  try {
    await fetch(`${API}/auth/logout`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${accessToken}` },
      credentials: 'include'
    });
  } catch (_) {}
  accessToken = null;
  showPage('login');
  document.getElementById('logout-btn-text').textContent = 'Sign out';
}

// ── Enter key support ──
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (document.getElementById('page-login').classList.contains('active')) handleLogin();
  if (document.getElementById('page-register').classList.contains('active')) handleRegister();
});

// ── Init ──
checkOAuthCallback();
</script>
</body>
</html>
